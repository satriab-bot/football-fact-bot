name: Generate Daily Football Fact

on:
  schedule:
    # Berjalan setiap hari pukul 17:00 UTC (artinya jam 00:00 WIB tengah malam)
    - cron: '0 17 * * *'
  workflow_dispatch: # Tombol untuk menjalankan skrip secara manual kapan saja untuk testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-generativeai

      - name: Run Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        python generate_fact.py

      - name: Commit and Push JSON Result
        run: |
          git config --global user.name "Football Fact Bot"
          git config --global user.email "bot@github.com"
          git add today_fact.json
          git commit -m "Auto-update daily football fact [skip ci]" || exit 0
          git push
