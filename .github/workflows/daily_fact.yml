name: Generate Daily Football Fact (External Trigger)

on:
  repository_dispatch:
    types: [run-fact-bot]
  workflow_dispatch: # Biar tetap bisa ditrigger manual jika diperlukan

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai duckduckgo-search

      - name: Run Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_fact.py

      - name: Commit and Push JSON Result
        run: |
          git config --global user.name "Football Fact Bot"
          git config --global user.email "bot@github.com"
          git add today_fact.json
          git commit -m "Auto-update daily football fact [skip ci]" || exit 0
          git push
