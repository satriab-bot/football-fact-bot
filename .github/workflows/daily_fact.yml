name: Generate Daily Football Fact

on:
  schedule:
    - cron: '7 0 * * *'   # 22:17 UTC = 05:17 WIB
  workflow_dispatch:

concurrency:
  group: daily-football-fact
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai duckduckgo-search requests beautifulsoup4

      - name: Run Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_fact.py

      - name: Commit and Push JSON Result
        run: |
          git config user.name "Football Fact Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today_fact.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, skip commit."
            exit 0
          fi
          git commit -m "Auto-update daily football fact [skip ci]"
          git pull --rebase
          git push
